<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1D1D1F" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="gHeart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF2D55"/><stop offset="1" stop-color="#FF9500"/></linearGradient>
    <linearGradient id="gFocus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34C759"/><stop offset="1" stop-color="#30B0C7"/></linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5856D6"/><stop offset="1" stop-color="#007AFF"/></linearGradient>
    <linearGradient id="gBad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9500"/><stop offset="1" stop-color="#FF2D55"/></linearGradient>
    <linearGradient id="gCase" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3A3C"/><stop offset="1" stop-color="#1C1C1E"/></linearGradient>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5856D6"/><stop offset="1" stop-color="#30B0C7"/></linearGradient>
    <clipPath id="cA"><rect x="888" y="591" width="90" height="108" rx="22"/></clipPath>
    <clipPath id="cB"><rect x="1000" y="591" width="90" height="108" rx="22"/></clipPath>
    <style>
      .f { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; }
      .ink { fill: #1D1D1F; } .mute { fill: #6E6E73; } .soft { fill: #86868B; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#FBFBFD"/>

  <!-- header -->
  <text x="80" y="66" class="f soft" font-size="14" font-weight="600" letter-spacing="2.5">FLOWBEAT · 02 / ENGINEERING</text>
  <text x="1520" y="66" class="f soft" font-size="14" text-anchor="end">github.com/xungirl/Flowbeat</text>
  <text x="80" y="124" class="f ink" font-size="50" font-weight="700" letter-spacing="-1">Tested, verified, <tspan fill="url(#gHead)">ready for review</tspan>.</text>
  <text x="80" y="164" class="f mute" font-size="21">Everything here ran in the watchOS simulator, in local tests and in GitHub Actions.</text>
  <rect x="1392" y="140" width="128" height="34" rx="17" fill="#E9F8EE"/>
  <circle cx="1414" cy="157" r="6" fill="#34C759"/>
  <text x="1430" y="163" class="f" font-size="15" font-weight="700" fill="#248A3D">CI green</text>

  <!-- stat row -->
  <g filter="url(#sh)">
    <rect x="80" y="210" width="460" height="160" rx="28" fill="#FFF"/>
    <rect x="570" y="210" width="460" height="160" rx="28" fill="#FFF"/>
    <rect x="1060" y="210" width="460" height="160" rx="28" fill="#FFF"/>
  </g>
  <text x="112" y="300" class="f" font-size="72" font-weight="800" fill="url(#gFocus)" letter-spacing="-2">157</text>
  <text x="270" y="272" class="f ink" font-size="21" font-weight="700">Swift tests</text>
  <text x="270" y="298" class="f mute" font-size="15">macOS + watchOS 11.4 simulator</text>
  <text x="112" y="344" class="f soft" font-size="14">FlowbeatCore · xcodebuild test</text>

  <text x="602" y="300" class="f" font-size="72" font-weight="800" fill="url(#gHeart)" letter-spacing="-2">48</text>
  <text x="712" y="272" class="f ink" font-size="21" font-weight="700">backend tests</text>
  <text x="712" y="298" class="f mute" font-size="15">pytest, scripted fake providers</text>
  <text x="602" y="344" class="f soft" font-size="14">no LLM calls needed to run them</text>

  <text x="1092" y="300" class="f" font-size="72" font-weight="800" fill="url(#gIndigo)" letter-spacing="-2">0 / 6</text>
  <text x="1300" y="272" class="f ink" font-size="21" font-weight="700">network markers</text>
  <text x="1300" y="298" class="f mute" font-size="15">in the Release binary</text>
  <text x="1092" y="344" class="f soft" font-size="14">Debug 6 / 6 · verify_release_offline.sh</text>

  <!-- anchoring card -->
  <g filter="url(#sh)"><rect x="80" y="400" width="740" height="320" rx="28" fill="#FFF"/></g>
  <text x="112" y="446" class="f soft" font-size="13" font-weight="700" letter-spacing="2">FOUND &amp; FIXED · LLM JUDGE</text>
  <text x="112" y="484" class="f ink" font-size="28" font-weight="700" letter-spacing="-0.5">Caught the model copying our score</text>
  <text x="112" y="514" class="f mute" font-size="16">It returned the on-device rule score verbatim instead of judging.</text>
  <text x="112" y="538" class="f mute" font-size="16">We removed the score from the prompt and measured again.</text>

  <text x="112" y="584" class="f ink" font-size="15" font-weight="600">Rule score in prompt (old)</text>
  <rect x="112" y="596" width="560" height="22" rx="11" fill="#F2F2F7"/>
  <rect x="112" y="596" width="186.7" height="22" rx="11" fill="url(#gBad)"/>
  <text x="688" y="613" class="f ink" font-size="20" font-weight="800">10 / 30</text>

  <text x="112" y="652" class="f ink" font-size="15" font-weight="600">Rule score removed (new default)</text>
  <rect x="112" y="664" width="560" height="22" rx="11" fill="#F2F2F7"/>
  <circle cx="123" cy="675" r="7" fill="#34C759"/>
  <text x="688" y="681" class="f" font-size="20" font-weight="800" fill="#248A3D">0 / 30</text>
  <text x="112" y="708" class="f soft" font-size="13">scores equal to the rule score · 90 real API calls · 2 models × 3 conditions · 6 synthetic windows</text>

  <!-- review fix -->
  <g filter="url(#sh)"><rect x="860" y="400" width="660" height="150" rx="28" fill="#FFF"/></g>
  <text x="892" y="446" class="f soft" font-size="13" font-weight="700" letter-spacing="2">FOUND &amp; FIXED · /v1/review</text>
  <text x="892" y="482" class="f ink" font-size="24" font-weight="700" letter-spacing="-0.3">First live review silently fell back</text>
  <text x="892" y="510" class="f mute" font-size="16">The model echoed the raw JSON Schema we put in the prompt.</text>
  <text x="892" y="534" class="f mute" font-size="16">Fix: a flat field spec. Live re-check: <tspan class="ink" font-weight="700">2 / 2 reviews valid</tspan>.</text>

  <!-- app store -->
  <g filter="url(#sh)"><rect x="860" y="570" width="660" height="150" rx="28" fill="#FFF"/></g>
  <rect x="882" y="585" width="102" height="120" rx="28" fill="url(#gCase)"/>
  <rect x="994" y="585" width="102" height="120" rx="28" fill="url(#gCase)"/>
  <image href="img/en-2-summary.png" x="888" y="591" width="90" height="108" preserveAspectRatio="xMidYMid slice" clip-path="url(#cA)"/>
  <image href="img/en-5-ondevice.png" x="1000" y="591" width="90" height="108" preserveAspectRatio="xMidYMid slice" clip-path="url(#cB)"/>
  <text x="1124" y="616" class="f soft" font-size="13" font-weight="700" letter-spacing="2">APP STORE MATERIALS</text>
  <text x="1124" y="650" class="f ink" font-size="24" font-weight="700" letter-spacing="-0.3">Ready to submit</text>
  <text x="1124" y="678" class="f mute" font-size="15">Listing EN / 中文 · privacy policy · review notes</text>
  <text x="1124" y="700" class="f mute" font-size="15">40 screenshots: 2 watch sizes × 2 languages</text>

  <!-- honest status -->
  <rect x="80" y="760" width="1440" height="150" rx="28" fill="#FFF6EC" stroke="#FF9500" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="112" y="804" class="f" font-size="13" font-weight="700" fill="#C93400" letter-spacing="2">HONEST STATUS</text>
  <g class="f">
    <circle cx="120" cy="846" r="6" fill="#FF9500"/>
    <text x="136" y="852" class="ink" font-size="18" font-weight="600">Simulator only</text>
    <text x="136" y="878" class="mute" font-size="15">never run on a real Apple Watch</text>

    <circle cx="480" cy="846" r="6" fill="#FF9500"/>
    <text x="496" y="852" class="ink" font-size="18" font-weight="600">Score not validated</text>
    <text x="496" y="878" class="mute" font-size="15">against real labeled data</text>

    <circle cx="840" cy="846" r="6" fill="#FF9500"/>
    <text x="856" y="852" class="ink" font-size="18" font-weight="600">Personalization</text>
    <text x="856" y="878" class="mute" font-size="15">tested on synthetic data only</text>

    <circle cx="1200" cy="846" r="6" fill="#FF9500"/>
    <text x="1216" y="852" class="ink" font-size="18" font-weight="600">Not submitted yet</text>
    <text x="1216" y="878" class="mute" font-size="15">developer account pending</text>
  </g>

  <text x="80" y="956" class="f soft" font-size="13">Sources: README.md (tests, Run 3, Journey stage 9) · backend/scripts/results/ · scripts/verify_release_offline.sh · docs/appstore/</text>
</svg>
