<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1D1D1F" flood-opacity="0.08"/>
    </filter>
    <filter id="shw" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1D1D1F" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="gHeart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF2D55"/><stop offset="1" stop-color="#FF9500"/></linearGradient>
    <linearGradient id="gFocus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34C759"/><stop offset="1" stop-color="#30B0C7"/></linearGradient>
    <linearGradient id="gIndigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5856D6"/><stop offset="1" stop-color="#007AFF"/></linearGradient>
    <linearGradient id="gCal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9500"/><stop offset="1" stop-color="#FFCC00"/></linearGradient>
    <linearGradient id="gStrap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8E8ED"/><stop offset="1" stop-color="#D2D2D7"/></linearGradient>
    <linearGradient id="gCase" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3A3C"/><stop offset="1" stop-color="#1C1C1E"/></linearGradient>
    <linearGradient id="gHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2D55"/><stop offset="0.5" stop-color="#FF9500"/><stop offset="1" stop-color="#30B0C7"/></linearGradient>
    <clipPath id="cHero"><rect x="106" y="266" width="268" height="328" rx="58"/></clipPath>
    <clipPath id="cM1"><rect x="1048" y="278" width="124" height="148" rx="28"/></clipPath>
    <clipPath id="cM2"><rect x="1216" y="278" width="124" height="148" rx="28"/></clipPath>
    <clipPath id="cM3"><rect x="1384" y="278" width="124" height="148" rx="28"/></clipPath>
    <clipPath id="cPhone"><rect x="1428" y="786" width="70" height="150" rx="13"/></clipPath>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#86868B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .f { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; }
      .ink { fill: #1D1D1F; } .mute { fill: #6E6E73; } .soft { fill: #86868B; }
      .card { fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#FBFBFD"/>

  <!-- header -->
  <text x="80" y="66" class="f soft" font-size="14" font-weight="600" letter-spacing="2.5">FLOWBEAT · 01 / HOW IT WORKS</text>
  <text x="1520" y="66" class="f soft" font-size="14" text-anchor="end">github.com/xungirl/Flowbeat</text>
  <text x="80" y="124" class="f ink" font-size="50" font-weight="700" letter-spacing="-1">Your focus, read from your <tspan fill="url(#gHead)">wrist</tspan>.</text>
  <text x="80" y="164" class="f mute" font-size="21">Heart rate and wrist motion become a live 0–100 focus score. The App Store build runs entirely on the watch.</text>

  <!-- hero watch -->
  <rect x="150" y="196" width="180" height="80" rx="22" fill="url(#gStrap)"/>
  <rect x="150" y="584" width="180" height="84" rx="22" fill="url(#gStrap)"/>
  <g filter="url(#shw)">
    <rect x="90" y="250" width="300" height="360" rx="74" fill="url(#gCase)"/>
  </g>
  <rect x="388" y="338" width="14" height="50" rx="6" fill="#2C2C2E"/>
  <rect x="390" y="408" width="9" height="56" rx="4" fill="#2C2C2E"/>
  <rect x="106" y="266" width="268" height="328" rx="58" fill="#000"/>
  <image href="img/en-1-focus.png" x="106" y="266" width="268" height="328" preserveAspectRatio="xMidYMid slice" clip-path="url(#cHero)"/>
  <text x="240" y="712" class="f ink" font-size="19" font-weight="600" text-anchor="middle">Live focus ring</text>
  <text x="240" y="736" class="f soft" font-size="15" text-anchor="middle">watchOS simulator, demo mode</text>

  <!-- pipeline -->
  <path d="M404 300 C440 300 440 282 474 282" fill="none" stroke="#C7C7CC" stroke-width="2" marker-end="url(#ar)"/>

  <g filter="url(#sh)">
    <rect x="480" y="230" width="520" height="104" rx="26" class="card"/>
    <rect x="480" y="352" width="520" height="104" rx="26" class="card"/>
    <rect x="480" y="474" width="520" height="104" rx="26" class="card"/>
    <rect x="480" y="596" width="520" height="122" rx="26" class="card"/>
  </g>

  <circle cx="530" cy="282" r="24" fill="url(#gHeart)"/>
  <path d="M530 293 C521 286 516 281 516 275 C516 270 520 267 524 267 C527 267 529 269 530 271 C531 269 533 267 536 267 C540 267 544 270 544 275 C544 281 539 286 530 293 Z" fill="#FFF"/>
  <text x="572" y="274" class="f ink" font-size="21" font-weight="700">Sense</text>
  <text x="572" y="302" class="f mute" font-size="16">Heart rate, wrist motion and steps, read on the watch</text>

  <circle cx="530" cy="404" r="24" fill="url(#gCal)"/>
  <text x="530" y="411" class="f" font-size="17" font-weight="700" fill="#FFF" text-anchor="middle">60s</text>
  <text x="572" y="396" class="f ink" font-size="21" font-weight="700">Calibrate</text>
  <text x="572" y="424" class="f mute" font-size="16">60 seconds of resting heart rate set your baseline</text>

  <circle cx="530" cy="526" r="24" fill="url(#gFocus)"/>
  <circle cx="530" cy="526" r="12" fill="none" stroke="#FFF" stroke-width="3.5"/>
  <text x="572" y="512" class="f ink" font-size="21" font-weight="700">Score 0–100</text>
  <text x="572" y="538" class="f mute" font-size="16">Rule-based, on-device, every second</text>
  <text x="572" y="560" class="f mute" font-size="16">Walking pauses scoring instead of counting as distraction</text>

  <circle cx="530" cy="650" r="24" fill="url(#gIndigo)"/>
  <text x="530" y="656" class="f" font-size="15" font-weight="700" fill="#FFF" text-anchor="middle">f(x)</text>
  <text x="572" y="640" class="f ink" font-size="21" font-weight="700">Personalize <tspan class="soft" font-weight="500" font-size="17">optional</tspan></text>
  <text x="572" y="666" class="f mute" font-size="16">Logistic regression trained on the watch from your</text>
  <text x="572" y="688" class="f mute" font-size="16">Focused / Distracted labels (≥ 8 each), blended 50/50</text>

  <g stroke="#C7C7CC" stroke-width="2" stroke-linecap="round">
    <path d="M530 336 V350"/><path d="M530 458 V472"/><path d="M530 580 V594"/>
  </g>

  <path d="M1004 470 C1022 470 1022 360 1036 360" fill="none" stroke="#C7C7CC" stroke-width="2" marker-end="url(#ar)"/>

  <!-- outputs -->
  <text x="1040" y="250" class="f soft" font-size="14" font-weight="600" letter-spacing="2.5">ON YOUR WRIST</text>
  <g filter="url(#sh)">
    <rect x="1040" y="270" width="140" height="164" rx="36" fill="url(#gCase)"/>
    <rect x="1208" y="270" width="140" height="164" rx="36" fill="url(#gCase)"/>
    <rect x="1376" y="270" width="140" height="164" rx="36" fill="url(#gCase)"/>
  </g>
  <image href="img/en-6-pomodoro.png" x="1048" y="278" width="124" height="148" preserveAspectRatio="xMidYMid slice" clip-path="url(#cM1)"/>
  <image href="img/en-8-history.png" x="1216" y="278" width="124" height="148" preserveAspectRatio="xMidYMid slice" clip-path="url(#cM2)"/>
  <image href="img/en-10-widgets.png" x="1384" y="278" width="124" height="148" preserveAspectRatio="xMidYMid slice" clip-path="url(#cM3)"/>
  <g class="f mute" font-size="14" text-anchor="middle">
    <text x="1110" y="458">Pomodoro</text><text x="1278" y="458">History</text><text x="1446" y="458">Complications</text>
  </g>

  <g filter="url(#sh)">
    <rect x="1040" y="484" width="232" height="66" rx="20" class="card"/><rect x="1288" y="484" width="232" height="66" rx="20" class="card"/>
    <rect x="1040" y="564" width="232" height="66" rx="20" class="card"/><rect x="1288" y="564" width="232" height="66" rx="20" class="card"/>
    <rect x="1040" y="644" width="232" height="66" rx="20" class="card"/><rect x="1288" y="644" width="232" height="66" rx="20" class="card"/>
  </g>
  <g class="f">
    <circle cx="1064" cy="517" r="6" fill="#FF2D55"/><text x="1080" y="512" class="ink" font-size="16" font-weight="600">Haptic nudge</text><text x="1080" y="534" class="soft" font-size="13">after 3 min of low focus</text>
    <circle cx="1312" cy="517" r="6" fill="#FF9500"/><text x="1328" y="512" class="ink" font-size="16" font-weight="600">Pomodoro + goals</text><text x="1328" y="534" class="soft" font-size="13">25 / 5 by default</text>
    <circle cx="1064" cy="597" r="6" fill="#34C759"/><text x="1080" y="592" class="ink" font-size="16" font-weight="600">History &amp; streak</text><text x="1080" y="614" class="soft" font-size="13">Swift Charts</text>
    <circle cx="1312" cy="597" r="6" fill="#30B0C7"/><text x="1328" y="592" class="ink" font-size="16" font-weight="600">Complications</text><text x="1328" y="614" class="soft" font-size="13">WidgetKit + App Group</text>
    <circle cx="1064" cy="677" r="6" fill="#5856D6"/><text x="1080" y="672" class="ink" font-size="16" font-weight="600">Siri · Shortcuts</text><text x="1080" y="694" class="soft" font-size="13">Action button · App Intents</text>
    <circle cx="1312" cy="677" r="6" fill="#007AFF"/><text x="1328" y="672" class="ink" font-size="16" font-weight="600">iPhone companion</text><text x="1328" y="694" class="soft" font-size="13">session timeline, not in v1</text>
  </g>

  <!-- release vs debug -->
  <g filter="url(#sh)">
    <rect x="80" y="770" width="700" height="180" rx="28" fill="#FFFFFF"/>
  </g>
  <rect x="80" y="770" width="700" height="180" rx="28" fill="none" stroke="#34C759" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="108" y="796" width="196" height="28" rx="14" fill="#E9F8EE"/>
  <text x="206" y="815" class="f" font-size="13" font-weight="700" fill="#248A3D" text-anchor="middle" letter-spacing="1.2">APP STORE v1 · RELEASE</text>
  <text x="108" y="866" class="f ink" font-size="30" font-weight="700" letter-spacing="-0.5">Fully on-device. No network.</text>
  <text x="108" y="900" class="f mute" font-size="16">No backend URL, token or HTTP client in the binary; HRV permission is not requested.</text>
  <text x="108" y="926" class="f mute" font-size="16">Checked by scanning the Release build: 0 of 6 network markers present.</text>

  <rect x="820" y="770" width="700" height="180" rx="28" fill="#FFFFFF" fill-opacity="0.6" stroke="#5856D6" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="7 7"/>
  <rect x="848" y="796" width="206" height="28" rx="14" fill="#EEEEFC"/>
  <text x="951" y="815" class="f" font-size="13" font-weight="700" fill="#5856D6" text-anchor="middle" letter-spacing="1.2">DEBUG ONLY · FLOWBEAT_AI</text>
  <text x="848" y="866" class="f ink" font-size="30" font-weight="700" letter-spacing="-0.5">Optional LLM judge</text>
  <text x="848" y="900" class="f mute" font-size="16">Every 2 min: a statistics-only summary + your labels</text>
  <text x="848" y="924" class="f mute" font-size="16">→ FastAPI backend → {state, score, reason}. Compiled out.</text>
  <image href="img/ci-phone-detail.png" x="1428" y="786" width="70" height="150" preserveAspectRatio="xMidYMin slice" clip-path="url(#cPhone)"/>
  <rect x="1428" y="786" width="70" height="150" rx="13" fill="none" stroke="#D2D2D7" stroke-width="1.5"/>
</svg>
