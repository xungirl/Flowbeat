[project]
name = "flowbeat-backend"
version = "0.1.0"
description = "Flowbeat AI judge: turns 2-minute watch summaries into focus judgments via an LLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.70",
    "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
