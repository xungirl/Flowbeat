name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  docker:
    name: Docker image builds and serves /healthz
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flowbeat-backend backend
      - name: Refuses to start without a token
        # uvicorn exits 3 when lifespan startup fails; 124 would mean it started and timed out
        run: |
          set +e
          docker run --rm -e LLM_PROVIDER=fake flowbeat-backend timeout 15 uvicorn app.main:app --port 8765
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 3
      - name: Serves /healthz and enforces the token
        run: |
          docker run -d --name fb -p 8765:8765 -e LLM_PROVIDER=fake -e FLOWBEAT_TOKEN=ci-token flowbeat-backend
          for i in $(seq 1 20); do curl -fsS localhost:8765/healthz && break; sleep 1; done
          echo
          W='{"window":{"minute_of_session":1,"local_time":"10:00","motion_mean":0.01,"motion_max":0.02,"still_ratio":1,"away_seconds":0}}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -XPOST localhost:8765/v1/judge -H 'content-type: application/json' -d "$W")" = 401
          curl -fsS -XPOST localhost:8765/v1/judge -H 'content-type: application/json' -H 'X-Flowbeat-Token: ci-token' -d "$W"
          echo
          docker logs fb | tail -5

  swift-core:
    name: FlowbeatCore swift test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path FlowbeatCore
