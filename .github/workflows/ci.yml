name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  docker:
    name: Docker image builds and serves /healthz
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flowbeat-backend backend
      - name: Refuses to start without a token
        # uvicorn exits 3 when lifespan startup fails; 124 would mean it started and timed out
        run: |
          set +e
          docker run --rm -e LLM_PROVIDER=fake flowbeat-backend timeout 15 uvicorn app.main:app --port 8765
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 3
      - name: Serves /healthz and enforces the token
        run: |
          docker run -d --name fb -p 8765:8765 -e LLM_PROVIDER=fake -e FLOWBEAT_TOKEN=ci-token flowbeat-backend
          for i in $(seq 1 20); do curl -fsS localhost:8765/healthz && break; sleep 1; done
          echo
          W='{"window":{"minute_of_session":1,"local_time":"10:00","motion_mean":0.01,"motion_max":0.02,"still_ratio":1,"away_seconds":0}}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -XPOST localhost:8765/v1/judge -H 'content-type: application/json' -d "$W")" = 401
          curl -fsS -XPOST localhost:8765/v1/judge -H 'content-type: application/json' -H 'X-Flowbeat-Token: ci-token' -d "$W"
          echo
          docker logs fb | tail -5

  swift-core:
    name: FlowbeatCore swift test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path FlowbeatCore

  apps:
    name: Watch tests + Release offline check + iPhone builds and screenshots
    runs-on: macos-15
    defaults:
      run:
        # pipefail: `xcodebuild ... | tail` must fail the step when xcodebuild fails
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Pick simulators
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d = json.load(open("devices.json"))["devices"]
          def pick(prefix, name):
              for rt in sorted(d, reverse=True):
                  if prefix in rt:
                      for dev in d[rt]:
                          if dev["name"].startswith(name):
                              return dev["udid"]
          print(f"IPHONE={pick('iOS', 'iPhone')}")
          print(f"WATCH={pick('watchOS', 'Apple Watch')}")
          PY
          cat "$GITHUB_ENV"
      - name: FlowbeatCore tests on a watchOS simulator (xcodebuild)
        run: |
          xcodebuild test -project Flowbeat.xcodeproj -scheme Flowbeat -destination "id=$WATCH" \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO | tail -n 5
      - name: Release (AI off) watch build contains no backend/network code
        # builds Debug + Release of the watch-only scheme, scans both binaries (see the script header)
        run: DEST="id=$WATCH" scripts/verify_release_offline.sh dd-verify
      - name: Build iPhone app (embeds the watch app)
        run: |
          xcodebuild build -project Flowbeat.xcodeproj -scheme FlowbeatPhone -destination "id=$IPHONE" \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO | tail -n 3
          ls dd/Build/Products/Debug-iphonesimulator/FlowbeatPhone.app/Watch/
      - name: Build iPhone app, Release configuration
        run: |
          xcodebuild build -project Flowbeat.xcodeproj -scheme FlowbeatPhone -configuration Release \
            -destination "id=$IPHONE" -derivedDataPath dd CODE_SIGNING_ALLOWED=NO | tail -n 3
          ls dd/Build/Products/Release-iphonesimulator/FlowbeatPhone.app/Watch/
      - name: Screenshot the iPhone app in the simulator
        run: |
          mkdir -p shots
          xcrun simctl boot "$IPHONE"
          xcrun simctl bootstatus "$IPHONE" -b
          xcrun simctl status_bar "$IPHONE" override --time 9:41 || true
          xcrun simctl install "$IPHONE" dd/Build/Products/Debug-iphonesimulator/FlowbeatPhone.app
          xcrun simctl launch "$IPHONE" com.xungirl.flowbeat
          sleep 8
          xcrun simctl io "$IPHONE" screenshot shots/phone-list.png
          xcrun simctl terminate "$IPHONE" com.xungirl.flowbeat
          xcrun simctl launch "$IPHONE" com.xungirl.flowbeat -openFirst
          sleep 8
          xcrun simctl io "$IPHONE" screenshot shots/phone-detail.png
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-screenshots
          path: shots/
