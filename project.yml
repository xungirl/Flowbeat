name: Flowbeat
options:
  bundleIdPrefix: com.xungirl
  deploymentTarget:
    watchOS: "10.0"
packages:
  # 纯逻辑放在本地 Swift package 里：macOS 上 `swift test`，watchOS 模拟器上 `xcodebuild test` 都能跑
  FlowbeatCore:
    path: FlowbeatCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Flowbeat:
    type: application
    platform: watchOS
    sources: [Flowbeat]
    dependencies:
      - package: FlowbeatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xungirl.flowbeat
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # 在 Xcode 里 Signing & Capabilities 选你自己的 Team 后会写进这里
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_CFBundleDisplayName: Flowbeat
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: 读取心率，用来估计你是否处于专注状态。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 开启专注时段需要启动一个「身心」类体能训练以持续读取心率（结束时不会保存）。
        INFOPLIST_KEY_NSMotionUsageDescription: 识别你是否起身走动，走动时暂停打分，不算作走神。
    info:
      path: Flowbeat/Info.plist
      properties:
        WKApplication: true
        WKBackgroundModes: [workout-processing]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Flowbeat/Flowbeat.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
schemes:
  Flowbeat:
    build:
      targets:
        Flowbeat: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: FlowbeatCore/FlowbeatCoreTests
